name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 仓库根按类别组织：主项目在 core/，插件在 plugins/。
    # 主项目的 pytest rootdir 就是 core/（core/pytest.ini）。
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ⚠️ 必须装齐「收集期」就会 import 的依赖，否则不是测试失败而是
      #    **收集失败**（pytest exit 2 + "Interrupted: N error during collection"），
      #    六个 job 一起红，一个测试都没跑。
      #
      # 以 core/requirements.txt 为单一事实来源，不要在 workflow 里另维护手写清单 ——
      # 我试过手写，连补三轮都还在漏（soundfile → librosa → torch → transformers），
      # 每轮都得等一次 CI 才知道下一个缺什么，纯浪费。
      #
      # 只排除 4 个「测试用不到、且体积/网络代价大」的包：
      #   voxcpm                     —— 需要模型权重，相关用例自己 skip
      #   onnxruntime                —— 惰性 import（在函数体内），缺了不影响收集
      #   faster-whisper/ctranslate2 —— 同上
      # torch 单独走 CPU 轮子（约 124MB；默认 PyPI 是 CUDA 版，CI 上纯浪费，
      # 且这些用例只用到张量算术，不需要 GPU）。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy librosa soundfile fastapi uvicorn
          python -m pip install python-multipart pypinyin lameenc imageio-ffmpeg
          python -m pip install transformers pytest pytest-timeout

      - name: Run tests
        run: python -m pytest tests -v

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # plugins/ 下的方言插件也要一起过语法检查，
      # 否则一个手滑的插件可以静默上线（发现期不加载 = 不会在测试里暴露）。
      - name: Compile all Python sources
        run: |
          python -m compileall -q core
          python -m compileall -q plugins

  frontend-syntax:
    name: inline JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # server.py 把前端内联成一个大 <script>。
      # 历史上曾因 JS 字符串拼接出语法错误，导致整页交互静默失效
      # （V8 解析失败 -> 所有 onclick 失活）。这里用 node --check 兜住。
      - name: Extract inline JS and validate with node
        working-directory: core
        run: python scripts/check_inline_js.py
