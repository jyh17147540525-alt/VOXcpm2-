name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 仓库根按类别组织：主项目在 core/，插件在 plugins/。
    # 主项目的 pytest rootdir 就是 core/（core/pytest.ini）。
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只装纯逻辑测试所需的轻量依赖。
      # torch / onnxruntime / voxcpm 体量大且需要权重才能跑，
      # 相关测试会因缺少模型而自动 skip（见 core/tests/test_mdx_separator.py）。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest pytest-timeout

      - name: Run tests
        run: python -m pytest tests -v

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # plugins/ 下的方言插件也要一起过语法检查，
      # 否则一个手滑的插件可以静默上线（发现期不加载 = 不会在测试里暴露）。
      - name: Compile all Python sources
        run: |
          python -m compileall -q core
          python -m compileall -q plugins

  frontend-syntax:
    name: inline JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # server.py 把前端内联成一个大 <script>。
      # 历史上曾因 JS 字符串拼接出语法错误，导致整页交互静默失效
      # （V8 解析失败 -> 所有 onclick 失活）。这里用 node --check 兜住。
      - name: Extract inline JS and validate with node
        working-directory: core
        run: python scripts/check_inline_js.py
