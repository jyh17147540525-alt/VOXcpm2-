name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 仓库根按类别组织：主项目在 core/，插件在 plugins/。
    # 主项目的 pytest rootdir 就是 core/（core/pytest.ini）。
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ⚠️ 这里必须装齐「收集期」就会 import 的依赖，否则不是测试失败而是
      #    **收集失败**（pytest exit 2 + "Interrupted: N error during collection"），
      #    六个 job 一起红。这条链在模块顶层，`--collect-only` 都过不去：
      #      tests/test_bracket_tags.py -> server.py:30   -> soundfile
      #      core/tests/* -> voice_clone/__init__.py      -> preprocess -> librosa
      #      server.py:119 -> voice_clone.trainer         -> torch
      #      server.py:31  -> uvicorn / fastapi
      #
      # torch 用 **CPU 轮子**（--index-url .../whl/cpu，约 200MB，不是 CUDA 版的 2.5GB）。
      # 这些用例只用 torch 的类型/张量算术，不需要 GPU，也不需要模型权重。
      #
      # voxcpm / onnxruntime / demucs / faster_whisper 仍然不装：它们是**惰性**
      # import（在函数体内），相关用例自己会 skip，不影响收集。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile librosa pypinyin
          python -m pip install fastapi uvicorn starlette safetensors imageio_ffmpeg lameenc
          python -m pip install pytest pytest-timeout
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest tests -v

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # plugins/ 下的方言插件也要一起过语法检查，
      # 否则一个手滑的插件可以静默上线（发现期不加载 = 不会在测试里暴露）。
      - name: Compile all Python sources
        run: |
          python -m compileall -q core
          python -m compileall -q plugins

  frontend-syntax:
    name: inline JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # server.py 把前端内联成一个大 <script>。
      # 历史上曾因 JS 字符串拼接出语法错误，导致整页交互静默失效
      # （V8 解析失败 -> 所有 onclick 失活）。这里用 node --check 兜住。
      - name: Extract inline JS and validate with node
        working-directory: core
        run: python scripts/check_inline_js.py
