[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 沙箱/CI 里跳过无关警告噪音
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestRemovedIn10Warning

# 单测最长 5 分钟（MDX 首次加载 + 推理在 CPU 上较慢）
timeout = 300

# 简洁输出
addopts = -q --tb=short

markers =
    slow: 需要模型权重或较长时间（CI 上会自动 skip）
